<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https://i.scdn.co https://*.scdn.co https://mosaic.scdn.co https://image-cdn-ak.spotifycdn.com https://*.spotifycdn.com data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Search & Play</title>
<style>
  :root { --gold: #ffd100; --amber: #ff8c1a; --gold-dark: #8c6108; --bg: #0f0c09; --panel: #1b150c; --line: #3a2c12; --text: #fff3cc; --dim: #998c73; --err: #ff4d40; }
  * { box-sizing: border-box; margin: 0; user-select: none; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 13px -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; border: 1px solid #735a1f; border-radius: 10px; }
  body::before { content: ""; display: block; height: 3px; flex: none; background: linear-gradient(90deg, var(--gold-dark), var(--amber)); }
  #bar { display: flex; align-items: center; padding: 10px 12px 0; gap: 6px; -webkit-app-region: drag; }
  #bar > * { -webkit-app-region: no-drag; }
  .tab { border: 0; background: transparent; color: var(--dim); font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .tab:hover { color: var(--gold); }
  .tab.on { color: var(--gold); background: #2a2012; }
  #bar .spacer { flex: 1; -webkit-app-region: drag; }
  #closeBtn { border: 0; background: transparent; color: var(--dim); font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 5px; }
  #closeBtn:hover { color: var(--gold); background: #2a2012; }

  #chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 12px 4px; }   /* all eight fit on one row at the window width; wrap is only a safety net */
  .chip { border: 1px solid var(--line); background: transparent; color: var(--dim); font: inherit; font-size: 11px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; cursor: pointer; }
  .chip:hover { color: var(--gold); border-color: var(--gold-dark); }
  .chip.on { color: #1a1206; background: var(--gold); border-color: var(--gold); font-weight: 600; }
  body.playlists-tab #chips { display: none; }

  .field { margin: 10px 12px 6px; }
  input[type=text] { width: 100%; height: 34px; padding: 0 12px; border-radius: 7px; border: 1px solid #735a1f; background: #17110a; color: var(--text); font: inherit; font-size: 14px; outline: none; user-select: text; }
  input[type=text]:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,209,0,.15); }
  input::placeholder { color: var(--dim); }

  #list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  #list::-webkit-scrollbar { width: 8px; } #list::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .row:hover, .row.sel { background: #2a2012; }
  .row.sel .title, .row:hover .title { color: var(--gold); }
  .section { padding: 10px 8px 4px; font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--amber); }
  .section:first-child { padding-top: 4px; }
  .row.more { color: var(--dim); font-size: 12px; padding: 8px 10px; }
  .row.more:hover, .row.more.sel { color: var(--gold); }
  .art.round { border-radius: 50%; }
  .art { width: 40px; height: 40px; flex: none; border-radius: 4px; background: var(--panel) center/cover; border: 1px solid var(--line); }
  .text { min-width: 0; flex: 1; }
  .title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .play { flex: none; color: var(--dim); font-size: 12px; opacity: 0; }
  .row:hover .play, .row.sel .play { opacity: 1; color: var(--gold); }
  .empty { text-align: center; color: var(--dim); padding: 60px 24px 0; line-height: 20px; }
  .empty.err { color: var(--err); }

  #foot { flex: none; display: flex; justify-content: space-between; padding: 7px 14px 9px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  #msg { color: var(--err); }
  #msg.ok { color: var(--gold); }
</style>
</head>
<body>
  <div id="bar">
    <button class="tab on" id="tabSearch">Search</button>
    <button class="tab" id="tabPlaylists">Your playlists</button>
    <span class="spacer"></span>
    <button id="closeBtn" title="Close (Esc)">&#10005;</button>
  </div>
  <div class="field"><input type="text" id="q" placeholder="Search songs, podcasts, audiobooks and more" autocomplete="off" spellcheck="false"></div>
  <div id="chips">
    <button class="chip on" data-view="all">All</button>
    <button class="chip" data-view="track">Songs</button>
    <button class="chip" data-view="artist">Artists</button>
    <button class="chip" data-view="album">Albums</button>
    <button class="chip" data-view="playlist">Playlists</button>
    <button class="chip" data-view="show">Podcasts</button>
    <button class="chip" data-view="episode">Episodes</button>
    <button class="chip" data-view="audiobook">Audiobooks</button>
  </div>
  <div id="list"></div>
  <div id="foot"><span id="hint"></span><span id="msg"></span></div>
  <script src="library.js"></script>
</body>
</html>
